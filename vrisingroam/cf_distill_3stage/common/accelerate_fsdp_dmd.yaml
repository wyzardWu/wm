# Accelerate + FSDP config for GameMaster DMD (3x5B models).
# DIFFERENCE vs accelerate_fsdp.yaml: sync_module_states=false + cpu_ram_efficient_loading=false.
# dmd_gm.py load_dit_ckpt loads the SAME checkpoint deterministically on EVERY rank, so rank0
# does NOT need to broadcast weights. With sync_module_states=true, rank0 materializes all 3
# full 5B models for the broadcast -> a ~75GB rank0 prepare peak that OOMs. Disabling it keeps
# each rank's prepare to just its own shard.
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
use_cpu: false
machine_rank: 0
num_machines: 1
num_processes: 3
rdzv_backend: static
same_network: true
fsdp_config:
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: DiTBlock
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_offload_params: false
  fsdp_use_orig_params: true
  fsdp_sync_module_states: false        # weights already loaded identically on all ranks
  fsdp_cpu_ram_efficient_loading: false # (requires sync_module_states; off since we load per-rank)
  fsdp_activation_checkpointing: false
downcast_bf16: 'no'
tpu_use_cluster: false
tpu_use_sudo: false
