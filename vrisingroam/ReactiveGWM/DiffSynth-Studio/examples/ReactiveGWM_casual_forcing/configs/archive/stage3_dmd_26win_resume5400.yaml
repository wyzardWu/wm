# Stage 3 DMD 26-latent-window resume config.
# Purpose: resume from sf3_casual_forcing_2/stage3_dmd/state-5400, but disable long-tail rollout.
# Launch with RESUME_STATE=/home/zeqingwang/zeqingwang/models/train/sf3_casual_forcing_2/stage3_dmd/state-5400.
stage: dmd
mixed_precision: "no"  # FSDP FULL_SHARD/NO_WRAP 下禁用 fp32 master；模型本体仍 bf16，避免额外 ~16GB/rank

max_steps: 50000
save_steps: 200

# Resume 会从 state-5400 恢复模型/optimizer/scheduler/RNG/EMA；student_init 仅用于非 resume 初始化兜底。
student_init: /nfs/zeqingwang/models/train/sf3_casual_forcing/stage2_cd/step-7500.safetensors

# New output dir to avoid overwriting the long-rollout run.
output_path: /home/zeqingwang/zeqingwang/models/train/sf3_casual_forcing_2/stage3_dmd_26win_from5400

# 26 latent window: frame0 = GT anchor，frame1-25 = generated；DMD/critic loss 排除 frame0。
dmd_score_frames: 26
dmd_long_rollout: false

# Disabled for 26-window baseline; kept as comments to make the regime explicit.
# dmd_rollout_min_frames: 26
# dmd_rollout_max_frames: 26
# dmd_rollout_force_max_prob: 0.0

# Not used when dmd_long_rollout=false.
dmd_random_action_extend: false
dmd_action_extend_mode: preset_chunks
dmd_action_chunk_frames: 10
dmd_random_action_neutral_prob: 0.3
dmd_random_action_direction_prob: 0.4

# No tail re-anchor in fixed 26-window mode: frame0 is the GT first-frame anchor.
dmd_tail_reanchor: none
dmd_reanchor_decode_latents: 1

same_step_across_blocks: true
ts_schedule: false
denoising_loss_type: flow
real_guidance_scale: 3.0
fake_guidance_scale: 0.0
dmd_timestep_clamp: [20, 980]
dfake_gen_update_ratio: 5
lr: 2.0e-6
lr_critic: 4.0e-7
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
dmd_ema_decay: 0.99
dmd_ema_start_step: 200

# ReactiveGWM 26-window regime: keep the same sink+recent KV strategy used by the existing demo/plan.
dmd_train_kv_window: 16
dmd_train_sink: 2

# EMA fp32 shadow 默认放 CPU: Stage 3 EMA 每 5 步才更新，只在 generator step 更新。
dmd_ema_shadow_device: cpu

# Keep high-water CUDA reserved memory stable during training.
dmd_empty_cache_each_phase: false
dmd_gc_interval: 0
dmd_keep_last_ckpts: 0
dmd_teacher_offload_cpu: true

# Sanity: 4-step KV-cache (= warped [1000,750,500,250]). 用 EMA 权重推理.
sanity_sample_sampler: dmd
sanity_sample_guidance_scale: 3.0
sanity_sample_memory_fraction: 0.45
sanity_sample_diffusion_steps: 4
