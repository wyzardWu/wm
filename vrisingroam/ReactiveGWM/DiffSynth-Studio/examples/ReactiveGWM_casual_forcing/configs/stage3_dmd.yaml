# Stage 3 Asymmetric DMD self-forcing (CF 上游 v2) — 仅覆盖差异项.
# 共享键见 default.yaml; DMD 算法点见 PLAN.md §2 Stage 3 + stage3_cf_alignment_review.md.
# 卡数由 launch 的 NUM_PROCESSES 控制 (Stage 3 runner 固定 grad_accum=1, 全局 batch = 卡数);
# 不需要单独的 4card yaml.
stage: dmd
mixed_precision: "no"  # FSDP FULL_SHARD/NO_WRAP 下禁用 fp32 master；模型本体仍 bf16，避免额外 ~16GB/rank

max_steps: 50000     # 上限; Stage 3 明确靠每 save_steps sanity 盯崩溃/plateau → 早停兜底 (PLAN §2)
save_steps: 200      # 200 步存一次 (用户要求, 早存少丢; checkpoint 默认全部保留)

# generator 从 Stage 2 CD 最终产物 (step-20000) 起步; teacher/critic 从 base_ckpt (双向 base) 起步.
#   STUDENT_INIT env 仍可覆盖; base_ckpt 见 default.yaml.
student_init: /home/zeqingwang/zeqingwang/models/train/sf3_casual_forcing_2/stage2_cd/step-20000.safetensors

output_path: /home/zeqingwang/zeqingwang/models/train/sf3_casual_forcing_2/stage3_dmd

# DMD 4-step + 双向 score (default.yaml 已有大部分; 这里显式重申关键项).
dmd_score_frames: 26

# CF++ long-tail DMD: 长程 rollout 到 L，只对末尾 26 latent frames 做 DMD / critic loss。
dmd_long_rollout: true
dmd_rollout_min_frames: 26
dmd_rollout_max_frames: 101
dmd_rollout_force_max_prob: 0.3

# action continuation: 真实 101-frame prefix 不够时，用合法 action preset chunks 补齐。
dmd_random_action_extend: true
dmd_action_extend_mode: preset_chunks
dmd_action_chunk_frames: 10
dmd_random_action_neutral_prob: 0.3
dmd_random_action_direction_prob: 0.4

# tail frame0 re-anchor: 只 decode tail anchor 附近短 latent chunk，不 decode 整个 prefix。
dmd_tail_reanchor: vae
dmd_reanchor_decode_latents: 5

same_step_across_blocks: true
ts_schedule: false
denoising_loss_type: flow
real_guidance_scale: 3.0
fake_guidance_scale: 0.0
dmd_timestep_clamp: [20, 980]
dfake_gen_update_ratio: 5
lr: 2.0e-6
lr_critic: 4.0e-7
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
dmd_ema_decay: 0.99
dmd_ema_start_step: 200

# 训练 rollout: 对齐长视频推理的 sink+recent cache；保留前 2 帧 + 最近 16 帧。
dmd_train_kv_window: 16
dmd_train_sink: 2

# EMA fp32 shadow 默认放 CPU: Stage 3 EMA 每 5 步才更新 (只在 generator step), CPU↔GPU
# 传输成本被摊薄, 换 ~20GB VRAM (3×5B 同驻显存紧). 显存够+想提速可改 cuda.
dmd_ema_shadow_device: cpu

# 稳定占用显存 (用户要求): 不在每个 phase 边界 release, 让 PyTorch 持有高水位 reserved →
# 邻居抢不走我已释放的内存, 杜绝"低点被抢→涨回峰值 OOM"的 race. 代价: 常占 ~高水位
# (8 卡分片后单卡 reserved ~100GB, +danze 21GB 仍 < 143). 配 launch 的 expandable_segments 抗碎片.
# gc_interval=0: 关掉周期性 empty_cache (否则每 100 步又 release 一次, 破坏稳定占用).
dmd_empty_cache_each_phase: false
dmd_gc_interval: 0
# checkpoint 默认全部保留；如需防爆盘, 手动设为正数只保留最近 N 个 state-N / step-N。
dmd_keep_last_ckpts: 0
# 冻结 teacher 仅 generator loss 打分使用；CPU offload 不改数学，释放 critic/backward 的 ~10GB VRAM。
dmd_teacher_offload_cpu: true

# sanity: 4-step KV-cache (= warped [1000,750,500,250]). 用 EMA 权重推理.
# Stage3 DMD 训练使用 re-noise sampler；肉眼对比 step-3800 显示 DMD sampler + CFG=3
# 比 CFG-off 稳定，CFG-off 虽部分帧 sharp 指标高但画面会崩。
sanity_sample_sampler: dmd
sanity_sample_guidance_scale: 3.0
# Stage3 完整 9.4GB DiT + CFG 双 cache 需要高于默认 0.2。
sanity_sample_memory_fraction: 0.45
sanity_sample_diffusion_steps: 4
